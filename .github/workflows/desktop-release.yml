name: Desktop release (Windows, NVIDIA)

# The Windows installer of this fork, with the CUDA 13 engine inside (RTX 20 series and newer: sm_75, sm_86, sm_89, sm_120 + PTX),
# signed for the app's own updater (Tauri) and published as a GitHub release: the installer, its .sig, latest.json, SHA256SUMS.txt.
#
#   Release:  push a tag v<version>, where <version> is the one in app/desktop/src-tauri/Cargo.toml (e.g. v1.0.0).
#   Try out:  Actions -> "Desktop release (Windows, NVIDIA)" -> Run workflow. Same build; the files are kept as a workflow
#             artifact for 7 days and nothing is published.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the content of tauri-updater.key (its public key is plugins.updater.pubkey in tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if it has none)
#
# Nothing here needs the feed key: the engine and Control ship inside the installer, and the app updates only through Tauri.
# The fork publishes no update feed, so the engines of models that run on a program of their own ship inside the installer too:
# Inkling-2-Mini's strata-inkling goes in engine-bundle/shapes/inkling2/ and the app puts it where Control looks on first start.
# (Off for now: BUNDLE_INKLING below.  Hy4-Flash's strata-hy4 was never bundled.)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read only by default; only the publish job below may write a release, and it runs no build code.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUDA_VERSION: '13.0.2'
  CUDA_DIR: 'C:\cuda'
  ARCHS: '75;86;89;120'
  BUNDLE_INKLING: 'false'   # Inkling-2-Mini's engine: not built or bundled for now (see its step)

jobs:
  windows-nvidia:
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path app/desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$v") {
            throw "The tag ${{ github.ref_name }} does not match the app version $v (app/desktop/src-tauri/Cargo.toml). Tag v$v, or change the version first."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Strata $v"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.22.3'

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable

      # Only the parts of the toolkit the engine and the picture reader need, from NVIDIA's own redist directory, each checked
      # against the SHA-256 in NVIDIA's manifest. (CUDA 13 splits crt and nvvm out of nvcc: without them nvcc cannot compile.)
      - &cuda
        name: CUDA ${{ env.CUDA_VERSION }}
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist/'
          $manifest = Invoke-RestMethod "${base}redistrib_$env:CUDA_VERSION.json"
          $parts = 'cuda_nvcc', 'cuda_crt', 'libnvvm', 'cuda_cudart', 'cuda_cccl', 'cuda_nvrtc', 'libcublas', 'libnvjitlink',
                   'libnvptxcompiler', 'cuda_profiler_api', 'cuda_nvml_dev'
          New-Item -ItemType Directory -Force $env:CUDA_DIR | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'cuda-redist'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          foreach ($p in $parts) {
            $entry = $manifest.$p.'windows-x86_64'
            if (-not $entry) { Write-Host "skip $p (not in CUDA $env:CUDA_VERSION for Windows)"; continue }
            $zip = Join-Path $tmp (Split-Path $entry.relative_path -Leaf)
            Invoke-WebRequest "$base$($entry.relative_path)" -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $entry.sha256) { throw "${p}: SHA-256 does not match NVIDIA's manifest" }
            $out = Join-Path $tmp $p
            Expand-Archive $zip -DestinationPath $out -Force
            $root = Get-ChildItem $out -Directory | Select-Object -First 1
            Copy-Item (Join-Path $root.FullName '*') $env:CUDA_DIR -Recurse -Force
            Write-Host "installed $p $($manifest.$p.version)"
          }
          "CUDA_PATH=$env:CUDA_DIR" >> $env:GITHUB_ENV
          "CUDA_PATH_V13_0=$env:CUDA_DIR" >> $env:GITHUB_ENV
          "$env:CUDA_DIR\bin" >> $env:GITHUB_PATH
          if (Test-Path "$env:CUDA_DIR\bin\x64") { "$env:CUDA_DIR\bin\x64" >> $env:GITHUB_PATH }
          & "$env:CUDA_DIR\bin\nvcc.exe" --version

      - &ninja
        name: Ninja
        shell: pwsh
        run: |
          # ninja's own release, pinned by SHA-256 (no Chocolatey package in between)
          $zip = Join-Path $env:RUNNER_TEMP 'ninja-win.zip'
          Invoke-WebRequest 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65') { throw 'ninja: SHA-256 does not match' }
          $dir = Join-Path $env:RUNNER_TEMP 'ninja'
          Expand-Archive $zip -DestinationPath $dir -Force
          $dir >> $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      # tools/packaging/build_cuda_windows.py: the engine, the picture reader for the same cards, BUILD.json, the CUDA DLLs it
      # imports, the package manifest (engine-component.json) and its own --verify. The installed app copies the package folder
      # into the components folder on first start (app/host/server/bundled-engine.mjs); nothing is downloaded.
      - name: Engine (CUDA 13, RTX 20 series and newer)
        shell: pwsh
        env:
          BUILD_JOBS: '3'
          OUT: ${{ runner.temp }}\engine-out
          # the Inkling engine (built from the same tree in the next step) reads its own arch list: plain numbers, so sm_120 gets sm_120a FP4 code
          STRATA_CMAKE_EXTRA: -DSTRATA_INK_CUDA_ARCHS=${{ env.ARCHS }}
        run: |
          python tools/packaging/build_cuda_windows.py cuda13
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem $env:OUT -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'engine-component.json') } | Select-Object -First 1
          if (-not $pkg) { throw 'The engine build made no package folder.' }
          Copy-Item $pkg.FullName (Join-Path 'app/desktop/src-tauri/resources/engine-bundle' $pkg.Name) -Recurse
          Write-Host "bundled engine: $($pkg.Name)"

      # strata-inkling: Inkling-2-Mini's own engine program (engine/src/inkling2, component strata-inkling). Built in the engine's build tree,
      # packaged as the shape engine inkling2 (package_engine.py --shape: the CUDA DLLs it imports are copied in, and the OpenMP runtime
      # from the VC redist folder), checked, and bundled under engine-bundle/shapes/inkling2 (app/host/server/bundled-engine.mjs).
      # Off for now (2026-11-27): Inkling-2-Mini is out of the model menus until it is steady and fast on 8 GB cards
      # (app/host/src/lib/native-catalog.ts HIDDEN_FAMILIES); set BUNDLE_INKLING to 'true' to build and bundle it again.
      - name: Inkling-2-Mini engine (CUDA 13)
        if: env.BUNDLE_INKLING == 'true'
        shell: pwsh
        env:
          OUT: ${{ runner.temp }}\inkling-out
        run: |
          $build = 'build-win-cuda13'
          cmake --build $build -j 3 --target strata-inkling
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-ChildItem $build -Recurse -Filter 'strata-inkling.exe' | Select-Object -First 1
          if (-not $exe) { throw 'The build made no strata-inkling.exe.' }
          $ver = (Select-String -Path engine/src/inkling2/ink_main.cpp -Pattern '#define INKLING_VERSION "(.+)"').Matches[0].Groups[1].Value
          if (-not $ver) { throw 'No INKLING_VERSION in engine/src/inkling2/ink_main.cpp.' }
          $stage = Join-Path $env:RUNNER_TEMP 'inkling-stage'
          New-Item -ItemType Directory -Force $stage, $env:OUT | Out-Null
          Copy-Item $exe.FullName $stage
          & $exe.FullName --version
          if ($LASTEXITCODE) { Write-Host '::warning::strata-inkling.exe --version did not run on the build machine (no GPU driver here); the package is still checked below.' }
          # --search replaces package_engine.py's own search folders (CUDA_PATH, PATH), so the toolkit's are named here too
          $search = @()
          foreach ($d in "$env:CUDA_PATH\bin\x64", "$env:CUDA_PATH\bin") { if (Test-Path $d) { $search += '--search', $d } }
          if ($env:VCToolsRedistDir) {
            Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.OpenMP' -ErrorAction SilentlyContinue | ForEach-Object { $search += '--search', $_.FullName }
          }
          $archs = $env:ARCHS -split ';' | ForEach-Object { '--arch', "sm_$_" }
          $commit = (git rev-parse HEAD).Substring(0, 12)
          python tools/packaging/package_engine.py --src $stage --backend cuda --version $ver --out $env:OUT --shape inkling2 `
            @archs --arch "compute_$(($env:ARCHS -split ';')[-1])" --min-driver nvidia=580.65 --variant cuda13 --platform windows-x86_64 `
            --build-id "$commit+cuda$env:CUDA_VERSION" @search
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Join-Path $env:OUT "$ver-windows-x86_64-cuda-cuda13"
          python tools/packaging/package_engine.py --verify $pkg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/packaging/binary_deps.py $pkg
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dest = 'app/desktop/src-tauri/resources/engine-bundle/shapes/inkling2'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $pkg (Join-Path $dest (Split-Path $pkg -Leaf)) -Recurse
          Write-Host "bundled Inkling-2-Mini engine: $(Split-Path $pkg -Leaf)"

      - name: Control (pinned Python and hash-locked wheels)
        shell: pwsh
        run: |
          python app/desktop/scripts/stage-control.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Node runtime
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app/desktop/scripts/fetch-node.ps1

      - name: User interface
        shell: pwsh
        run: |
          npm ci --prefix app/host --no-audit --no-fund
          npm --prefix app/host run build
          npm ci --prefix app/desktop --no-audit --no-fund

      - name: Installer (signed for the app updater)
        shell: pwsh
        working-directory: app/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'The repository secret TAURI_SIGNING_PRIVATE_KEY is not set (Settings -> Secrets and variables -> Actions).' }
          $conf = Join-Path $env:RUNNER_TEMP 'updater.conf.json'
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Encoding utf8NoBOM $conf
          npx tauri build --bundles nsis --config $conf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # latest.json is what installed apps read (plugins.updater.endpoints: .../releases/latest/download/latest.json).
      # feed_tool.py checks the .sig against the public key in tauri.conf.json over the exact bytes before it writes the entry.
      - name: Release files
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $exe = Get-ChildItem app/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe -or -not (Test-Path "$($exe.FullName).sig")) { throw 'No signed installer was made.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "Strata-fork-$v-windows-x64-nvidia-setup.exe"
          Copy-Item $exe.FullName "dist/$name"
          Copy-Item "$($exe.FullName).sig" "dist/$name.sig"
          python tools/packaging/feed_tool.py set-app-platform --app-json dist/latest.json --target windows-x86_64 --version $v `
            --archive "dist/$name" --sig "dist/$name.sig" `
            --url "https://github.com/${{ github.repository }}/releases/download/v$v/$name"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $sums = Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Keep the files (manual runs; the publish job takes them from here for a tag)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: strata-fork-${{ steps.version.outputs.version }}-windows-nvidia
          path: dist/
          retention-days: 7

  # Quick checks, beside the full build: what fails there only after the long engine build fails here first. They publish nothing
  # and hold no secret; the installer made here has no engine inside, is not signed and is thrown away.
  quick-app:
    name: quick check (app, Control, installer script)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
      - name: User interface
        shell: pwsh
        run: |
          npm ci --prefix app/host --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix app/host run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix app/host run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix app/desktop --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Node runtime
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File app/desktop/scripts/fetch-node.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust (cargo check)
        shell: pwsh
        working-directory: app/desktop/src-tauri
        run: |
          cargo check --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Control (pinned Python and hash-locked wheels)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python app/desktop/scripts/stage-control.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installer script (debug build, no engine, not signed)
        shell: pwsh
        working-directory: app/desktop
        run: |
          npx tauri build --debug --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  quick-engine:
    name: quick check (the engine files the fork changes)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - *cuda
      - *ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64
      # the configure line of tools/packaging/build_cuda_windows.py with two architectures; only these objects, nothing is linked
      # (ink_main.cpp only while BUNDLE_INKLING is 'true')
      - name: Compile q36_engine.cu and ink_main.cpp
        shell: pwsh
        run: |
          $cuda = $env:CUDA_DIR.Replace('\', '/')
          cmake -G Ninja -S engine -B build-quick -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=OFF `
            -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_PORTABLE=ON '-DCMAKE_CUDA_ARCHITECTURES=75-real;120-real' `
            "-DCMAKE_CUDA_COMPILER=$cuda/bin/nvcc.exe" "-DCUDAToolkit_ROOT=$cuda" '-DSTRATA_INK_CUDA_ARCHS=75;120'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $objects = ninja -C build-quick -t targets all | Select-String -Pattern '^(\S*(?:strata_qwen35\.dir\S*q36_engine\.cu|strata-inkling\.dir\S*ink_main\.cpp)\.obj):' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($env:BUNDLE_INKLING -ne 'true') { $objects = @($objects | Where-Object { $_ -notmatch 'strata-inkling' }) }
          $want = if ($env:BUNDLE_INKLING -eq 'true') { 2 } else { 1 }
          if (@($objects).Count -ne $want) { throw "Expected $want objects, found: $objects" }
          ninja -C build-quick -k 0 $objects
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  publish:
    if: github.ref_type == 'tag'
    needs: windows-nvidia
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: strata-fork-${{ needs.windows-nvidia.outputs.version }}-windows-nvidia
          path: dist

      - name: Publish the release (tags)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Strata-fork ${{ needs.windows-nvidia.outputs.version }} (Windows, NVIDIA RTX 20 series and newer)
          make_latest: true
          files: dist/*
          body: |
            Windows installer with the CUDA 13 engine inside, for NVIDIA RTX 20 series and newer (driver 580.65 or newer).
            Installed copies update themselves from this release (Settings -> Updates).
            The installer is not code-signed: Windows SmartScreen asks once (More info -> Run anyway).
            SHA256SUMS.txt lists the SHA-256 of every file.
